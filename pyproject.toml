[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geomlint"
version = "0.1.0"
description = "Continuous validity, topology, and CRS-sanity checks for vector geospatial data — Monte Carlo for geometry columns."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Bishal Dhungana" }]
keywords = ["gis", "geospatial", "data-quality", "data-observability", "geojson", "shapefile", "gpkg", "crs", "topology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "shapely>=2.0",
    "pyproj>=3.5",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/DBishal13/geomlint"
Documentation = "https://DBishal13.github.io/geomlint/"
Repository = "https://github.com/DBishal13/geomlint"
Issues = "https://github.com/DBishal13/geomlint/issues"
Changelog = "https://github.com/DBishal13/geomlint/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
formats = ["pyogrio>=0.7"]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
geomlint = "geomlint.cli:main"

[tool.setuptools.packages.find]
include = ["geomlint*"]
