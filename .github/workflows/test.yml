name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,formats]"
      - run: pytest tests/ -v
      - name: dogfood — geomlint should find nothing wrong with its own clean fixture
        run: geomlint check tests/fixtures/clean --fail-on error
