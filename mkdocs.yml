site_name: geomlint
site_description: Continuous validity, topology, and CRS-sanity checks for vector geospatial data.
site_url: https://DBishal13.github.io/geomlint/
repo_url: https://github.com/DBishal13/geomlint
repo_name: DBishal13/geomlint
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - content.code.copy
    - search.suggest

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Checks reference: checks.md
  - Configuration: configuration.md
  - CLI reference: cli.md
  - CI integration: ci-integration.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
